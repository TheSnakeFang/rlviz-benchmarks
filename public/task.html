<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Exact benchmark task provenance and reviewed public trajectories." />
    <title>Task · RLViz Benchmarks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/task.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/">RLViz <span>Benchmarks</span></a>
      <nav><a href="https://rlviz.dev">open RLViz</a><a href="https://github.com/TheSnakeFang/rlviz-benchmarks">source</a></nav>
    </header>
    <main class="detail-shell">
      <a class="back-link" id="benchmark-back" href="/">← benchmark</a>
      <p id="detail-status" role="status">Loading exact task record…</p>
      <article id="detail" hidden>
        <header class="detail-header">
          <div><p class="eyebrow" id="detail-eyebrow"></p><h1 id="detail-title"></h1><p class="detail-summary" id="detail-summary"></p></div>
          <div class="detail-state"><span class="badge showcased">task view</span><p>Task content is not copied into this catalog. The exact benchmark revision remains the source of truth.</p></div>
        </header>
        <section class="detail-section" aria-labelledby="task-source-title"><h2 id="task-source-title">Source</h2><dl id="source-facts" class="detail-facts"></dl></section>
        <section class="detail-section" aria-labelledby="task-runs-title"><h2 id="task-runs-title">Trajectories</h2><div id="trajectory-list" class="detail-list"></div></section>
      </article>
    </main>
    <footer><span>Task identity without invented task metadata.</span><a href="https://github.com/TheSnakeFang/rlviz-benchmarks/blob/main/README.md#publication-boundary">publication rules</a></footer>
  </body>
</html>
