<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Exact benchmark provenance, external runs, public trajectories, and evidence claims." />
    <title>Benchmark · RLViz Benchmarks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/benchmark.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/">RLViz <span>Benchmarks</span></a>
      <nav><a href="https://rlviz.dev">open RLViz</a><a href="https://github.com/TheSnakeFang/rlviz-benchmarks">source</a></nav>
    </header>
    <main class="detail-shell">
      <a class="back-link" href="/">← all benchmarks</a>
      <p id="detail-status" role="status">Loading exact record…</p>
      <article id="detail" hidden>
        <header class="detail-header">
          <div><p class="eyebrow" id="detail-eyebrow"></p><h1 id="detail-title"></h1><p class="detail-summary" id="detail-summary"></p></div>
          <div class="detail-state"><span id="detail-badge" class="badge"></span><p id="detail-quality"></p></div>
        </header>
        <section class="detail-section" aria-labelledby="source-title"><h2 id="source-title">Source</h2><dl id="source-facts" class="detail-facts"></dl></section>
        <section class="detail-section" aria-labelledby="runs-title"><h2 id="runs-title">Runs</h2><div id="run-list" class="detail-list"></div></section>
        <section class="detail-section" aria-labelledby="claims-detail-title"><h2 id="claims-detail-title">Claims</h2><div id="claim-list" class="detail-list"></div></section>
      </article>
    </main>
    <footer><span>Exact evidence, with gaps left visible.</span><a href="https://github.com/TheSnakeFang/rlviz-benchmarks/blob/main/README.md#publication-boundary">publication rules</a></footer>
  </body>
</html>
