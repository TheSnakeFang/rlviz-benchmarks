<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Exact trajectory provenance, review state, bundle digest, and RLViz handoff." />
    <title>Trajectory · RLViz Benchmarks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/trajectory.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/">RLViz <span>Benchmarks</span></a>
      <nav><a href="https://rlviz.dev">Viewer</a><a href="https://github.com/TheSnakeFang/rlviz-benchmarks">GitHub</a></nav>
    </header>
    <main class="detail-shell">
      <a class="back-link" id="task-back" href="/">← task</a>
      <p id="detail-status" role="status">Loading exact trajectory record…</p>
      <article id="detail" hidden>
        <header class="detail-header">
          <div><h1 id="detail-title"></h1><p class="detail-summary" id="detail-summary"></p></div>
          <div class="detail-state"><span class="badge showcased">Reviewed trajectory</span><p>Only this trajectory is reviewed.</p></div>
        </header>
        <section class="detail-section" aria-labelledby="evidence-title"><h2 id="evidence-title">Evidence</h2><div><dl id="evidence-facts" class="detail-facts"></dl><div id="trajectory-actions" class="detail-actions"></div></div></section>
        <section class="detail-section" aria-labelledby="execution-title"><h2 id="execution-title">Execution</h2><dl id="execution-facts" class="detail-facts"></dl></section>
      </article>
    </main>
    <footer><a href="https://github.com/TheSnakeFang/rlviz-benchmarks/blob/main/README.md#publication-boundary">Publication rules</a></footer>
  </body>
</html>
