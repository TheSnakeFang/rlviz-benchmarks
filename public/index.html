<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Immutable benchmark provenance and reviewed public agent trajectories for RLViz." />
    <title>RLViz Benchmarks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/">RLViz <span>Benchmarks</span></a>
      <nav><a href="https://rlviz.dev">Viewer</a><a href="https://github.com/TheSnakeFang/rlviz-benchmarks">GitHub</a></nav>
    </header>
    <main>
      <section class="page-header" aria-labelledby="page-title">
        <h1 id="page-title">Benchmark catalog</h1>
        <p>Pinned benchmark records and reviewed public trajectories.</p>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <header>
          <div><h2 id="catalog-title">Records</h2><p id="catalog-status" role="status">Loading records…</p></div>
          <label>Filter <input id="filter" type="search" placeholder="name, state, revision" autocomplete="off" /></label>
        </header>
        <div id="benchmark-list" class="benchmark-list"></div>
      </section>

      <section class="catalog-note" aria-labelledby="claims-title">
        <div><h2 id="claims-title">Evidence claims</h2><p id="claims-status">Loading claims…</p></div>
        <a href="https://github.com/TheSnakeFang/rlviz-benchmarks/blob/main/README.md#publication-boundary">Review policy</a>
      </section>
    </main>
    <footer><span>Read-only. No account required.</span><a href="https://github.com/TheSnakeFang/rlviz-benchmarks/blob/main/README.md#publication-boundary">Publication rules</a></footer>
  </body>
</html>
